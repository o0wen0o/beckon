# Both platforms, every push (ADR-0013).
#
# The macOS half of `src-tauri/src/platform/` cannot be compiled on a Windows
# machine, so without this job the AppKit and CoreGraphics code would be
# reviewed but never built. That is the whole reason this file exists: it is the
# compiler for the half of the codebase most contributors cannot run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Typecheck the frontend
        run: npx tsc --noEmit

      - name: Build the frontend
        run: npm run build

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test

  # The bundlers themselves — MSI/NSIS on Windows, .app/.dmg on macOS. Slower
  # than `check`, and nothing above it exercises the icon set or Info.plist, so
  # it runs on demand rather than on every push.
  #
  # Not a release: `release.yml` does that from a tag (ADR-0022). This is the
  # smoke test for the bundlers, and it needs the signing key for the same
  # reason a local `tauri build` does — `createUpdaterArtifacts` is on, so an
  # unsigned bundle is an error rather than an artifact. A fork without the
  # secret cannot run this job; it can run everything above it.
  bundle:
    name: bundle (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: beckon-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app
          if-no-files-found: warn

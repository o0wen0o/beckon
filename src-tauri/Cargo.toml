[package]
name = "beckon"
version = "0.1.0"
description = "A background-resident LLM shortcut for Windows and macOS"
edition = "2021"
rust-version = "1.77"
default-run = "beckon"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes a transparent window legal on macOS; the
# Launcher and Popover are frameless cards over a transparent `<body>` on both
# platforms (ADR-0013). It is inert on Windows.
tauri = { version = "2", features = [
    "tray-icon",
    "image-png",
    "macos-private-api",
] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

# A Capture leaves the clipboard as a BMP on Windows and a TIFF on macOS, and
# goes on the wire as base64 PNG (ADR-0016). Default features off: the two
# decoders and the one encoder that path needs, nothing else.
base64 = "0.22"
image = { version = "0.25", default-features = false, features = [
    "png",
    "bmp",
    "tiff",
] }

# `rc`: a Capture's data URL lives behind an `Arc<str>` so resending the
# untruncated history (ADR-0004) is a refcount bump rather than megabytes of
# `memcpy` per turn.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
log = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }

# `notify` itself is used through the debouncer's re-export, so the two can
# never drift onto incompatible versions.
notify-debouncer-full = "0.5"
# The backend is chosen per target below; keyring's own default is a store that
# refuses every operation, which is what a third platform would get.
keyring = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The login Keychain, the AppKit half of `platform/macos/`, and CoreGraphics for
# the synthetic Cmd+C. Default features are left on deliberately: the objc2
# crates gate every class behind its own feature, and a missing one is a link
# error nobody on a Windows machine can see.
keyring = { version = "3", features = ["apple-native"] }
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
core-graphics = "0.24"

[dev-dependencies]
tempfile = "3"

[features]
# Tauri's custom-protocol is enabled by the CLI for release builds.
custom-protocol = ["tauri/custom-protocol"]

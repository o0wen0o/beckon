[package]
name = "beckon"
version = "0.1.0"
description = "A background-resident LLM shortcut for Windows"
edition = "2021"
rust-version = "1.77"
default-run = "beckon"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
log = "0.4"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }

# `notify` itself is used through the debouncer's re-export, so the two can
# never drift onto incompatible versions.
notify-debouncer-full = "0.5"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[features]
# Tauri's custom-protocol is enabled by the CLI for release builds.
custom-protocol = ["tauri/custom-protocol"]

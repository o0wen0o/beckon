<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient (Sleek Windows Dark Mode Glass) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="100%" stop-color="#0F0F17" />
    </linearGradient>

    <!-- Glowing Core Gradient (Summoning Energy) -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Accenting Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Subtle Drop Shadow for Layer Depth -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Base (Squircle Container) -->
  <rect x="16" y="16" width="224" height="224" rx="48" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2" filter="url(#shadow)" />

  <!-- Summon Ring (Concentrated Light Energy) -->
  <path d="M 128 52 
           C 170 52, 204 86, 204 128 
           C 204 170, 170 204, 128 204 
           C 86 204, 52 170, 52 128" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Secondary Dynamic Wave (Echoing Call) -->
  <path d="M 72 170
           C 58 156, 52 138, 52 128" 
        fill="none" 
        stroke="#00F2FE" 
        stroke-width="6" 
        stroke-linecap="round" 
        opacity="0.4" />

  <!-- Glowing Summoning Spark (The Cursor / AI Core) -->
  <g filter="url(#glow)">
    <!-- Main Spark/Diamond Body -->
    <path d="M 128 72 
             Q 128 128 184 128 
             Q 128 128 128 184 
             Q 128 128 72 128 
             Q 128 128 128 72 Z" 
          fill="url(#coreGrad)" />
    
    <!-- Ultra-bright Central Sparkle Point -->
    <circle cx="128" cy="128" r="8" fill="#FFFFFF" />
  </g>

  <!-- Tiny Accent Spark (Top Right - Instant Appearance) -->
  <path d="M 172 76 
           Q 172 90 186 90 
           Q 172 90 172 104 
           Q 172 90 158 90 
           Q 172 90 172 76 Z" 
        fill="#00F2FE" 
        opacity="0.9" />
</svg>
